<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>साहित्य ढाणी | Sahitya Dhani</title>
    <link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Yatra+One&family=Martel:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8B263E;
            --secondary: #D4AF37;
            --accent: #C85A32;
            --bg-color: #FAF4E8;
            --card-bg: #FFFDF9;
            --text-dark: #2B1E1A;
            --border-color: #E2D3C1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Martel', serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.8;
            background-image: radial-gradient(#d4af3733 1px, transparent 1px);
            background-size: 20px 20px;
        }

        header {
            background-color: var(--primary);
            color: #FFF;
            text-align: center;
            padding: 2.5rem 1rem;
            border-bottom: 5px solid var(--secondary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        header h1 {
            font-family: 'Rozha One', serif;
            font-size: 2.8rem;
            color: var(--secondary);
            margin-bottom: 0.3rem;
            letter-spacing: 1px;
        }

        header p {
            font-size: 1.1rem;
            color: #F7E7CE;
            font-style: italic;
        }

        nav {
            background-color: #5C1929;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1.5rem;
            flex-wrap: wrap;
            gap: 10px;
        }

        nav .nav-links {
            display: flex;
            gap: 15px;
        }

        nav a, nav button {
            color: #FFF;
            text-decoration: none;
            background: none;
            border: none;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 4px;
            transition: 0.3s;
        }

        nav a:hover, nav button:hover {
            background-color: var(--secondary);
            color: var(--primary);
        }

        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            position: relative;
        }

        .card h2 {
            font-family: 'Yatra One', cursive;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .badge {
            display: inline-block;
            background: var(--secondary);
            color: var(--primary);
            padding: 2px 8px;
            font-size: 0.8rem;
            border-radius: 4px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .content-preview {
            position: relative;
            max-height: 120px;
            overflow: hidden;
            white-space: pre-line;
        }

        .content-preview::after {
            content: "";
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 60px;
            background: linear-gradient(transparent, var(--card-bg));
        }

        .full-content {
            white-space: pre-line;
            margin-top: 10px;
        }

        .paywall-box {
            background: #FFF8E7;
            border: 1px dashed var(--accent);
            padding: 15px;
            text-align: center;
            border-radius: 6px;
            margin-top: 15px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 16px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: inherit;
        }

        footer {
            text-align: center;
            padding: 2rem;
            background: var(--primary);
            color: white;
            margin-top: 3rem;
            border-top: 4px solid var(--secondary);
        }
    </style>
</head>
<body>

    <header>
        <h1>साहित्य ढाणी</h1>
        <p>राजस्थानी संस्कृति एवं उत्कृष्ट साहित्य का डिजिटल संग्रह</p>
    </header>

    <nav>
        <div class="nav-links">
            <a href="#">मुख्य पृष्ठ</a>
            <button onclick="filterPosts('कविता')">कविताएं</button>
            <button onclick="filterPosts('कहानी')">कहानियां</button>
            <button onclick="filterPosts('ई-बुक')">ई-बुक्स</button>
        </div>
        <div>
            <button onclick="openPublishModal()" class="btn-primary">+ नई रचना</button>
            <button id="loginBtn" onclick="openLoginModal()">लेखक लॉगिन</button>
        </div>
    </nav>

    <div class="container" id="postsContainer">
        <!-- रचनाएं यहाँ दिखेंगी -->
    </div>

    <!-- नई रचना जोड़ने का मोडाल -->
    <div id="publishModal" class="modal">
        <div class="modal-content">
            <h2>नई रचना प्रकाशित करें</h2>
            <input type="text" id="postTitle" placeholder="शीर्षक (Title)">
            <select id="postCategory">
                <option value="कविता">कविता</option>
                <option value="कहानी">कहानी</option>
                <option value="ई-बुक">ई-बुक</option>
            </select>
            <textarea id="postContent" rows="6" placeholder="अपनी रचना यहाँ लिखें..."></textarea>
            <label><input type="checkbox" id="isPaid"> क्या यह पेड (Paid) सामग्री है?</label>
            <input type="number" id="postPrice" placeholder="कीमत (₹ में)" style="display:none;">
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button class="btn-primary" onclick="savePost()">पब्लिश करें</button>
                <button onclick="closeModal('publishModal')">रद्द करें</button>
            </div>
        </div>
    </div>

    <!-- लॉगिन मोडाल -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h2>लेखक लॉगिन / साइन-अप</h2>
            <input type="text" id="authorName" placeholder="आपका नाम / पेन नेम">
            <input type="email" id="authorEmail" placeholder="ईमेल आईडी">
            <button class="btn-primary" onclick="loginAuthor()">लॉगिन करें</button>
            <button onclick="closeModal('loginModal')">बंद करें</button>
        </div>
    </div>

    <footer>
        <p>© 2026 साहित्य ढाणी | सर्वाधिकार सुरक्षित</p>
    </footer>

    <script>
        let posts = JSON.parse(localStorage.getItem('sahitya_posts')) || [
            {
                id: 1,
                title: "केसरिया बालम",
                category: "कविता",
                author: "प्रताप सिंह",
                content: "केसरिया बालम आवो नी, पधारो म्हारे देस।\nमरुधरा री पावन माटी, गावे रीत अणेक।\nरंग-बिरंगी थारी धोरा री धरती, सुहानी लागे सांज।",
                isPaid: false,
                price: 0
            }
        ];

        function displayPosts(filter = 'all') {
            const container = document.getElementById('postsContainer');
            container.innerHTML = '';

            const filtered = filter === 'all' ? posts : posts.filter(p => p.category === filter);

            filtered.forEach(post => {
                const card = document.createElement('div');
                card.className = 'card';
                
                let contentHTML = '';
                if(post.isPaid) {
                    contentHTML = `
                        <div class="content-preview">${post.content}</div>
                        <div class="paywall-box">
                            <p>🔒 इस पूरी रचना/ई-बुक को पढ़ने के लिए ₹${post.price} का भुगतान करें।</p>
                            <button class="btn-primary" style="margin-top:8px;" onclick="unlockContent(${post.id})">अभी अनलॉक करें (Pay Now)</button>
                        </div>
                    `;
                } else {
                    contentHTML = `<div class="full-content">${post.content}</div>`;
                }

                card.innerHTML = `
                    <span class="badge">${post.category}</span>
                    <h2>${post.title}</h2>
                    <small>लेखक: ${post.author}</small>
                    ${contentHTML}
                `;
                container.appendChild(card);
            });
        }

        document.getElementById('isPaid').addEventListener('change', function() {
            document.getElementById('postPrice').style.display = this.checked ? 'block' : 'none';
        });

        function openPublishModal() { document.getElementById('publishModal').style.display = 'flex'; }
        function openLoginModal() { document.getElementById('loginModal').style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function loginAuthor() {
            const name = document.getElementById('authorName').value;
            if(name) {
                localStorage.setItem('sahitya_author', name);
                document.getElementById('loginBtn').innerText = name;
                closeModal('loginModal');
            }
        }

        function savePost() {
            const title = document.getElementById('postTitle').value;
            const category = document.getElementById('postCategory').value;
            const content = document.getElementById('postContent').value;
            const isPaid = document.getElementById('isPaid').checked;
            const price = document.getElementById('postPrice').value || 0;
            const author = localStorage.getItem('sahitya_author') || 'अज्ञात लेखक';

            if(!title || !content) {
                alert('कृपया शीर्षक और सामग्री दोनों लिखें!');
                return;
            }

            const newPost = { id: Date.now(), title, category, content, isPaid, price, author };
            posts.unshift(newPost);
            localStorage.setItem('sahitya_posts', JSON.stringify(posts));
            displayPosts();
            closeModal('publishModal');
        }

        function unlockContent(id) {
            alert('भुगतान गेटवे सिम्युलेटर: ₹' + posts.find(p=>p.id===id).price + ' का भुगतान सफल रहा! (यह एक डेमो है)');
        }

        function filterPosts(cat) { displayPosts(cat); }

        window.onload = function() {
            const savedAuthor = localStorage.getItem('sahitya_author');
            if(savedAuthor) document.getElementById('loginBtn').innerText = savedAuthor;
            displayPosts();
        }
    </script>
</body>
</html>
